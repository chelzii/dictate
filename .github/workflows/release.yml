name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[audio,test]'
      - run: python scripts/check.py
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-version.py --tag "$RELEASE_TAG"
      - run: python scripts/package.py
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --generate-notes
