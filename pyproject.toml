[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictate-desktop"
version = "0.2.2"
description = "Ubuntu X11 desktop dictation through a background ChatGPT webpage"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["python-xlib==0.33"]

[project.optional-dependencies]
audio = ["pulsectl==24.12.0"]
test = ["pulsectl==24.12.0", "pillow>=10,<12"]

[project.scripts]
dictate = "dictate.cli:main"

[tool.setuptools.packages.find]
where = ["native"]
