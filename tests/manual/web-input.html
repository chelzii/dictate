<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>后台听写测试</title><link rel="stylesheet" href="style.css"><body class="test">
<h1>后台听写测试</h1><p>先绑定 ChatGPT 专用页，再点击下面的输入框，按 <kbd>F9</kbd> 开始，说一句话，再按一次结束。整个过程中此页应保持前台。</p>
<label>普通输入框<input type="text" placeholder="点击这里，试着说：今天的工作已经完成。"></label>
<label>多行输入框<textarea placeholder="试一段较长的话。"></textarea></label>
<label>插入光标位置 / 替换选区<input type="text" value="开头 —— 结尾"></label>
<label>可编辑区域<div contenteditable="true">把光标放到这里，再开始听写。</div></label>
<p>录音时修改原文字或移动光标，工具应保留转写供复制，避免填错位置。每次最多约 5 分钟。按 Esc 可以取消。</p>
</body></html>
